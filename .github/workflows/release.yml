name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  # Required for npm provenance: the registry records which workflow published.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Validate tag against package versions
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for manifest in packages/*/package.json; do
            PACKAGE_VERSION=$(node -p "require('./$manifest').version")
            if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Tag $TAG_VERSION does not match $manifest ($PACKAGE_VERSION)"
              exit 1
            fi
          done

      - name: Validate
        run: pnpm validate:all

      - name: Publish
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  image:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read metadata
        id: metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/social-posting-server" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "node_major=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_MAJOR=${{ steps.metadata.outputs.node_major }}
            APP_VERSION=${{ steps.metadata.outputs.version }}
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
