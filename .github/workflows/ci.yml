name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, e2e, workerd, and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm build

      - name: Check
        run: pnpm check

      - name: Typecheck each package in isolation
        run: pnpm typecheck:packages

      - name: Run e2e tests
        run: pnpm test:e2e

      # The lint rule catches a typo; this catches a transitive dependency on a
      # Node built-in. Both are required for the packages to stay web-standard.
      - name: Run core tests under workerd
        run: pnpm test:workerd

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "node_major=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/docker/Dockerfile
          push: false
          load: false
          build-args: |
            NODE_MAJOR=${{ steps.metadata.outputs.node_major }}
            APP_VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
