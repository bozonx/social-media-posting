services:
  microservice:
    image: ghcr.io/bozonx/social-posting-server:${TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/server/docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: social-posting-server
    hostname: social-posting-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '${LISTEN_PORT:-8080}:8080'
    env_file:
      - ../../../.env
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const b=(process.env.BASE_PATH||'').replace(/^\\/+|\\/+$/g,'');const p='/'+(b?b+'/':'')+'api/v1/health';fetch('http://127.0.0.1:8080'+p).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
